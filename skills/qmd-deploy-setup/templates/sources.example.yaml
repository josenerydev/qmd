# qmd-mcp — indexed sources (multi-source).
# Copy to sources.yaml (same ./sources/ folder). The container reads /sources/sources.yaml.
# Without this file, it falls back to SINGLE-SOURCE mode (QMD_SOURCE_REPO_URL from .env).
#
# NO SECRETS: tokens live in .env and are referenced by `tokenEnv`.
# - git source   → cloned at boot into /data/<name>
# - local source → folder under ./sources/<path> (mounted at /sources/<path>)
#
# subdir (OPTIONAL): scopes the source to a subfolder of the repo/folder.
#   - WITH subdir    → downloads ONLY the subfolder (git sparse-checkout) and indexes just it.
#   - WITHOUT subdir → the whole repo/folder.
# mask (OPTIONAL): glob of the files to index; defaults to '**/*.md'.
#
# Merge: a query spans every collection; scope by name with the `collections` parameter.

sources:
  # --- public git repo -------------------------------------------------------
  - name: docs
    git: https://github.com/<org>/<repo>
    branch: main
    context: "Product documentation — decisions, guides and references."

  # --- private git repo (token in .env, referenced by name) ------------------
  # - name: internal
  #   git: https://dev.azure.com/<org>/<proj>/_git/<repo>
  #   tokenEnv: INTERNAL_REPO_TOKEN     # var name in .env (the token does NOT live here)
  #   subdir: docs                      # download and index only this folder
  #   mask: "**/*.{md,txt}"
  #   context: "Internal knowledge base — overrides the public docs where specified."

  # --- local folder (mounted at ./sources/<path>) -----------------------------
  # - name: notes
  #   path: notes
  #   context: "Local notes."
